name: Build DYLite

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build DYLite (.deb)
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos

      - name: Install xz support
        run: brew install xz || true

      - name: Setup iPhoneOS SDK
        run: |
          set -e
          mkdir -p ~/theos/sdks
          SDKD=$HOME/theos/sdks/iPhoneOS17.5.sdk
          for V in 16.0 15.4 15.3 15.2 15.1 15.0 14.3 14.2; do
            XP="/Applications/Xcode_$V.app"
            SP="$XP/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk"
            if [ -d "$SP" ]; then
              echo "Copy SDK from Xcode $V"
              cp -R "$SP" "$SDKD"
              exit 0
            fi
          done
          echo "Xcode SDK not available, downloading tar.gz..."
          curl -L --retry 3 --connect-timeout 30 --max-time 600 \
            -o /tmp/sdk.tar.gz \
            "https://github.com/xybp888/iOS-SDKs/releases/download/17.5/iPhoneOS17.5.sdk.tar.gz"
          tar -xzf /tmp/sdk.tar.gz -C ~/theos/sdks/ || {
            echo "tar.gz failed; try tar.xz..."
            curl -L --retry 3 --connect-timeout 30 --max-time 600 \
              -o /tmp/sdk.tar.xz \
              "https://github.com/xybp888/iOS-SDKs/releases/download/17.5/iPhoneOS17.5.sdk.tar.xz"
            which xzcat || brew install xz
            tar -xJf /tmp/sdk.tar.xz -C ~/theos/sdks/
          }
          ls ~/theos/sdks/

      - name: Setup env
        run: |
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Build rootful
        run: |
          ls ~/theos/sdks/
          make package-rootful FINALPACKAGE=1
          mkdir -p packages
          DEB=$(cat .theos/last_package 2>/dev/null)
          VER=$(awk '/^Version:/{print $2}' control)
          [ -f "$DEB" ] && cp "$DEB" "packages/DYLite_${VER}_arm-rootful.deb"

      - name: Build rootless
        run: |
          make package-rootless FINALPACKAGE=1
          mkdir -p packages
          DEB=$(cat .theos/last_package 2>/dev/null)
          VER=$(awk '/^Version:/{print $2}' control)
          [ -f "$DEB" ] && cp "$DEB" "packages/DYLite_${VER}_arm64-rootless.deb"

      - name: Build roothide
        run: |
          make package-roothide FINALPACKAGE=1 || true
          mkdir -p packages
          DEB=$(cat .theos/last_package 2>/dev/null)
          VER=$(awk '/^Version:/{print $2}' control)
          [ -f "$DEB" ] && cp "$DEB" "packages/DYLite_${VER}_arm64e-roothide.deb"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DYLite-packages
          path: packages/*
          retention-days: 90
          if-no-files-found: ignore

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  
