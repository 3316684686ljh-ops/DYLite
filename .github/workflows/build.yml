name: Build DYLite

# 触发条件：
# 1. 推送到 main/master 分支时自动编译
# 2. 在 GitHub 网页上手动点击 "Run workflow"
# 3. 创建 tag (如 v0.1.0) 时自动编译并发布 Release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build DYLite (.deb)
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos
        run: |
          echo "==> 下载 Theos 到 ~/theos"
          git clone --recursive https://github.com/theos/theos.git ~/theos

      - name: Download iOS SDK
        run: |
          echo "==> 下载 iPhoneOS SDK"
          mkdir -p ~/theos/sdks
          # 下载 SDK 压缩包
          curl -L "https://github.com/xybp888/iOS-SDKs/releases/download/17.5/iPhoneOS17.5.sdk.tar.xz" \
            -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C ~/theos/sdks
          echo "==> SDK 列表:"
          ls ~/theos/sdks/

      - name: Setup environment
        run: |
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Build packages
        run: |
          echo "==> 开始编译所有方案"
          make all-packages FINALPACKAGE=1

      - name: List built packages
        run: |
          echo "==> 编译产物:"
          ls -la packages/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DYLite-packages
          path: packages/*
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
